plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rtm.tamperdetector'
    compileSdk 34

    defaultConfig {
        applicationId "com.rtm.tamperdetector"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "2.4.0-TurboGPU"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'onnx'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'
}
